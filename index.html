<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark')}catch(e){}</script>
<title>Сөз іздеу - SözÖrnegi.kz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="nav"></header>

<div class="container py-5">
      <div class="text-center mb-4 mb-md-5">
      <h1 class="fw-bold mb-3" style="color:#1e3a8a">ЖАЗУШЫЛАР МӘТІНІНЕН ІЗДЕУ</h1>
      <p class="text-muted">Сөзді енгізіңіз, қажет сүзгілерді (бірнешеуін) таңдап, «Іздеу» батырмасын басыңыз</p>
    </div>

  <div class="row g-4"><div class="col-lg-9">

    <div class="search-wrapper" id="search">
      <div class="dropdown">
        <button class="btn btn-link mode-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" id="modeBtn">Сөз бойынша</button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item mode-item" href="#" data-mode="word">Сөз бойынша</a></li>
          <li><a class="dropdown-item mode-item" href="#" data-mode="meaning">Мағынасы бойынша</a></li>
        </ul>
      </div>
      <input type="text" class="search-input" id="searchInput" placeholder="Іздеу..">
      <button class="btn-clear" id="clearBtn" title="Тазалау"><i class="bi bi-x-lg"></i></button>
      <button class="btn-search" id="searchBtn"><i class="bi bi-search me-2"></i>Іздеу</button>
    </div>

    <div class="panel p-4 p-md-5 mb-4" id="filters">
      <button class="filters-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#filtersBody" aria-expanded="true" aria-controls="filtersBody"><span>Сүзгілер арқылы іздеу</span><span class="count-badge d-none" id="filtersCount"></span><span class="toggle-chip"><span class="tc-open">Жасыру</span><span class="tc-closed">Ашу</span><i class="bi bi-chevron-down"></i></span></button>
      <div class="collapse show" id="filtersBody"><div class="pt-4">
      <div class="row g-3">
        <div class="col-md-6">
          <div class="dropdown h-100">
            <button class="filter-card" data-bs-toggle="dropdown" data-bs-auto-close="outside" type="button">
              <span class="filter-title"><i class="bi bi-person me-2"></i>Авторлар<span class="count-badge d-none" id="authorCount"></span></span>
              <i class="bi bi-chevron-down opacity-50"></i>
            </button>
            <ul class="dropdown-menu filter-menu" id="authorsList"><li class="px-3 py-2 text-muted">Жүктелуде...</li></ul>
          </div>
        </div>
        <div class="col-md-6">
          <div class="dropdown h-100">
            <button class="filter-card" data-bs-toggle="dropdown" data-bs-auto-close="outside" type="button">
              <span class="filter-title"><i class="bi bi-book me-2"></i>Шығармалар<span class="count-badge d-none" id="workCount"></span></span>
              <i class="bi bi-chevron-down opacity-50"></i>
            </button>
            <ul class="dropdown-menu filter-menu" id="worksList"><li class="px-3 py-2 text-muted">Жүктелуде...</li></ul>
          </div>
        </div>
      </div>
      <div class="types-label d-none d-md-block">Сөз типтері</div>
      <button class="types-toggle d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#typesBody" aria-expanded="false" aria-controls="typesBody"><span><i class="bi bi-tags me-2"></i>Сөз типтері</span><span class="count-badge d-none" id="typesCount"></span><i class="bi bi-chevron-down ms-auto"></i></button>
      <div class="collapse types-collapse" id="typesBody"><div class="row g-2 g-md-3 mt-0 mt-md-1" id="typeFilters"></div></div>
      <div class="text-center mt-4"><button class="btn btn-outline-primary rounded-pill px-4 d-none" id="resetFilters"><i class="bi bi-arrow-counterclockwise me-1"></i>Сүзгілерді тазалау</button></div>
      </div></div>
    </div>

    <div class="chips" id="chips"></div>
    <div id="results" class="mb-5"></div>

  </div>
  <div class="col-lg-3">
    <aside class="daily-aside" id="daily"><div class="row g-4">
      <div class="col-md-6 col-lg-12"><div class="panel daily-card author h-100" id="dailyAuthor"><div class="daily-head"><i class="bi bi-person-badge-fill"></i>Күн авторы</div><div class="daily-body text-center text-muted small">Жүктелуде...</div></div></div>
      <div class="col-md-6 col-lg-12"><div class="panel daily-card word h-100" id="dailyWord"><div class="daily-head"><i class="bi bi-lightbulb-fill"></i>Күн сөзі</div><div class="daily-body text-center text-muted small">Жүктелуде...</div></div></div>
    </div></aside>
  </div>
  </div>
</div>

<div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content" style="border-radius:16px">
      <div class="modal-header"><h5 class="modal-title fw-bold" id="infoModalTitle">Ақпарат</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Жабу"></button></div>
      <div class="modal-body p-0" id="infoModalBody"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary px-5 rounded-pill" data-bs-dismiss="modal">Жабу</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="nav.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
