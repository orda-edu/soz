<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark')}catch(e){}</script>
<title>ҚМЖ - SözÖrnegi.kz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="nav"></header>

<div class="container py-5 d-none" id="kmzhBody">
  <div class="page-hero p-5 text-center mb-5 shadow"><h1 class="fw-bold mb-2">ҚЫСҚА МЕРЗІМДІ ЖОСПАРЛАР (ҚМЖ)</h1><div class="opacity-75">Тек мұғалімдерге арналған бөлім</div></div>
  <div id="list"><div class="text-center text-muted">Жүктелуде...</div></div>
</div>
<div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content" style="border-radius:16px;overflow:hidden">
      <div class="modal-header"><h5 class="modal-title fw-bold text-truncate" id="viewTitle">Көру</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Жабу"></button></div>
      <div class="modal-body p-0"><iframe id="viewFrame" title="Алдын ала көру" style="width:100%;height:75vh;border:0;background:#f8fafc"></iframe></div>
      <div class="modal-footer"><button type="button" class="btn btn-primary rounded-pill px-4" id="viewDl"><i class="bi bi-download me-1"></i>Жүктеу</button><button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Жабу</button></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="nav.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb = createClient('https://jkvjtjjimqvppvogotiu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imprdmp0amppbXF2cHB2b2dvdGl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODYzNzAsImV4cCI6MjEwODI2MjM3MH0.Zk-CdKAilLWVjwW8RmvmqRBfOFv9MyrJQxDGDud0qbs');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const { data: s } = await sb.auth.getSession();
if (!s.session) location.replace('teacher.html?from=kmzh');
else {
  document.getElementById('kmzhBody').classList.remove('d-none');
  const list = document.getElementById('list');
  const icon = n => { const e = (n.split('.').pop() || '').toLowerCase();
    return e === 'pdf' ? ['bi-file-earmark-pdf-fill', '#dc3545'] : e === 'pptx' ? ['bi-file-earmark-slides-fill', '#fd7e14'] : ['bi-file-earmark-word-fill', '#0d6efd']; };
  const { data, error } = await sb.from('kmzh').select('*').order('created_at', { ascending: false });
  if (error) list.innerHTML = `<div class="alert alert-danger">Қате: ${esc(error.message)}</div>`;
  else if (!data.length) list.innerHTML = '<div class="panel p-5 text-center"><i class="bi bi-journal-text display-4 text-primary"></i><p class="mt-3 mb-0">ҚМЖ файлдары жақында қосылады.</p></div>';
  else {
    list.innerHTML = '<div class="row g-3">' + data.map(r => { const [ic, col] = icon(r.file_name || r.file_path);
      return `<div class="col-md-6"><div class="panel p-3 d-flex align-items-center gap-3 kmzh-item">
        <i class="bi ${ic}" style="font-size:2.6rem;color:${col}"></i>
        <div class="flex-grow-1"><div class="fw-bold">${esc(r.title)}</div><div class="small text-muted">${esc(r.file_name)}</div></div>
        <div class="d-flex gap-2 flex-wrap justify-content-end kmzh-actions">
          <button class="btn btn-outline-primary rounded-pill px-3" data-act="view" data-path="${esc(r.file_path)}" data-name="${esc(r.file_name || r.file_path || 'file')}"><i class="bi bi-eye me-1"></i>Көру</button>
          <button class="btn btn-primary rounded-pill px-3" data-act="dl" data-path="${esc(r.file_path)}" data-name="${esc(r.file_name || 'file')}"><i class="bi bi-download me-1"></i>Жүктеу</button>
        </div></div></div>`; }).join('') + '</div>';

    const modalEl = document.getElementById('viewModal'), frame = document.getElementById('viewFrame');
    const dlUrl = async (path, name) => sb.storage.from('kmzh').createSignedUrl(path, 300, { download: name });
    let cur = null;
    modalEl.addEventListener('hidden.bs.modal', () => { frame.src = 'about:blank'; });
    document.getElementById('viewDl').addEventListener('click', async () => {
      if (!cur) return;
      const { data, error } = await dlUrl(cur.path, cur.name);
      if (error) alert('Қате: ' + error.message); else location.href = data.signedUrl;
    });

    list.addEventListener('click', async e => {
      const b = e.target.closest('[data-path]'); if (!b) return;
      const path = b.dataset.path, name = b.dataset.name;
      if (b.dataset.act === 'view') {
        const { data, error } = await sb.storage.from('kmzh').createSignedUrl(path, 3600);
        if (error) { alert('Қате: ' + error.message); return; }
        const ext = (name.split('.').pop() || '').toLowerCase();
        // PDF — браузерде тікелей, Word/PowerPoint — Microsoft Office viewer арқылы
        frame.src = ext === 'pdf' ? data.signedUrl : 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(data.signedUrl);
        document.getElementById('viewTitle').textContent = name;
        cur = { path, name };
        bootstrap.Modal.getOrCreateInstance(modalEl).show();
      } else {
        const { data, error } = await dlUrl(path, name);
        if (error) alert('Қате: ' + error.message); else location.href = data.signedUrl;
      }
    });
  }
}
</script>
</body>
</html>
