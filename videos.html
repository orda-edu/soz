<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-bs-theme','dark')}catch(e){}</script>
<title>Бейнесабақтар - SözÖrnegi.kz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="nav"></header>

<div class="container py-5">
  <div class="page-hero p-5 text-center mb-5 shadow"><h1 class="fw-bold mb-2"><i class="bi bi-play-circle-fill me-2"></i>БЕЙНЕСАБАҚТАР</h1></div>
  <div class="row g-4" id="list"><div class="text-center text-muted">Жүктелуде...</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="nav.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb = createClient('https://jkvjtjjimqvppvogotiu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imprdmp0amppbXF2cHB2b2dvdGl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODYzNzAsImV4cCI6MjEwODI2MjM3MH0.Zk-CdKAilLWVjwW8RmvmqRBfOFv9MyrJQxDGDud0qbs');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ytId(u) {
  try {
    const x = new URL(u), h = x.hostname.replace('www.', '');
    if (h === 'youtu.be') return x.pathname.slice(1).split('/')[0];
    if (h.endsWith('youtube.com')) {
      if (x.searchParams.get('v')) return x.searchParams.get('v');
      const m = x.pathname.match(/^\/(embed|shorts|live)\/([\w-]+)/); if (m) return m[2];
    }
  } catch (e) {}
  return null;
}
const list = document.getElementById('list');
const { data, error } = await sb.from('videos').select('*').order('created_at', { ascending: false });
if (error) list.innerHTML = `<div class="alert alert-danger">Қате: ${esc(error.message)}</div>`;
else if (!data.length) list.innerHTML = '<div class="panel p-5 text-center"><i class="bi bi-camera-video display-4 text-primary"></i><p class="mt-3 mb-0">Бейнесабақтар жақында қосылады.</p></div>';
else list.innerHTML = data.map(r => {
  const id = ytId(r.url);
  const media = id
    ? `<div class="ratio ratio-16x9"><iframe src="https://www.youtube.com/embed/${esc(id)}" title="${esc(r.title)}" allowfullscreen loading="lazy" style="border:0"></iframe></div>`
    : `<div class="p-5 text-center bg-light"><i class="bi bi-link-45deg display-3 text-primary"></i></div>`;
  return `<div class="col-md-6 col-lg-4"><div class="panel h-100 overflow-hidden d-flex flex-column">${media}
    <div class="p-3 d-flex flex-column flex-grow-1"><h5 class="fw-bold">${esc(r.title)}</h5>
    <a href="${esc(r.url)}" target="_blank" rel="noopener" class="btn btn-outline-primary rounded-pill mt-auto"><i class="bi bi-box-arrow-up-right me-1"></i>Ашу</a></div></div></div>`;
}).join('');
</script>
</body>
</html>
