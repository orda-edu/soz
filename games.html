<style>
  .game-card{transition:.25s;border:1px solid #e5e7eb;border-radius:16px}
  .game-card:hover{transform:translateY(-6px);box-shadow:0 14px 34px rgba(30,58,138,.15)}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:14px 18px;margin-bottom:10px;transition:.15s}

  /* сұрақ нөмірі: карточканың оң жақ жоғарғы бұрышында */

  .q-panel .btn{padding:.45rem 1rem}
  .q-badge{display:inline-block;padding:.35rem 1rem;font-weight:700;font-size:1.1rem;color:#fff;line-height:1.4;
    background:linear-gradient(135deg,#2563eb,#1e3a8a);border-radius:0 0 0 14px;box-shadow:0 4px 12px rgba(30,58,138,.25)}
  .q-badge-red{background:linear-gradient(135deg,#f43f5e,#be123c);box-shadow:0 4px 12px rgba(225,29,72,.25)}
  /* нәтиже беті: жауап белгілері (күндізгі және түнгі режим) */

  [data-bs-theme=dark] .ans-badge{background:#334155;color:#f1f5f9}
  .ans-badge.skip{background:#fef3c7;color:#92400e}
  [data-bs-theme=dark] .ans-badge.skip{background:#78350f;color:#fde68a}
  #app .badge.bg-success{background:#16a34a!important;color:#fff}
  #app .badge.bg-danger{background:#dc2626!important;color:#fff}
  /* ---- Әдемі батырмалар ---- */
  #app .btn{border-radius:999px;font-weight:600;letter-spacing:.2px;padding:.6rem 1.4rem;border-width:2px;
    transition:transform .15s ease,box-shadow .2s ease,filter .2s ease,background-color .2s,color .2s,border-color .2s}
  #app .btn-sm{padding:.35rem .95rem}
  #app .btn-lg{padding:.8rem 1.6rem;font-size:1.05rem;letter-spacing:.4px}
  #app .btn:not(:disabled):hover{transform:translateY(-2px)}
  #app .btn:not(:disabled):active{transform:translateY(0) scale(.97);box-shadow:none!important}
  #app .btn:focus-visible{box-shadow:0 0 0 .25rem rgba(59,130,246,.35)}
  #app .btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
  #app .btn-primary{background:linear-gradient(135deg,#2563eb,#1e3a8a);border-color:transparent;box-shadow:0 6px 16px rgba(37,99,235,.32)}
  #app .btn-success{background:linear-gradient(135deg,#22c55e,#15803d);border-color:transparent;box-shadow:0 6px 16px rgba(22,163,74,.32)}
  #app .btn-danger{background:linear-gradient(135deg,#f43f5e,#be123c);border-color:transparent;box-shadow:0 6px 16px rgba(225,29,72,.3)}
  #app .btn-warning{background:linear-gradient(135deg,#fbbf24,#d97706);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(217,119,6,.3)}
  #app .btn-info{background:linear-gradient(135deg,#22d3ee,#0e7490);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(14,116,144,.3)}
  #app .btn-secondary{background:linear-gradient(135deg,#94a3b8,#475569);border-color:transparent;box-shadow:0 6px 16px rgba(71,85,105,.28)}
  #app .btn-dark{background:linear-gradient(135deg,#334155,#0f172a);border-color:transparent;box-shadow:0 6px 16px rgba(15,23,42,.3)}
  #app .btn-primary:not(:disabled):hover,#app .btn-success:not(:disabled):hover,#app .btn-danger:not(:disabled):hover,
  #app .btn-warning:not(:disabled):hover,#app .btn-info:not(:disabled):hover,#app .btn-secondary:not(:disabled):hover,
  #app .btn-dark:not(:disabled):hover{filter:brightness(1.08) saturate(1.1);box-shadow:0 10px 22px rgba(30,58,138,.28)}
  #app .btn-outline-secondary{background:rgba(148,163,184,.08)}
  #app .btn-outline-primary:hover,#app .btn-outline-success:hover,#app .btn-outline-warning:hover,#app .btn-outline-danger:hover,
  #app .btn-outline-info:hover,#app .btn-outline-secondary:hover,#app .btn-outline-dark:hover{box-shadow:0 8px 18px rgba(30,58,138,.18)}
  /* ойын карточкаларындағы "ОЙНАУ" батырмасы */
  .game-card .btn{padding:.65rem 1rem;letter-spacing:.8px}
  .game-card .btn i{transition:transform .2s}
  .game-card:hover .btn i{transform:translateX(4px)}
  /* жауап нұсқалары мен сәйкестендіру карточкалары */
  .opt,.mitem{box-shadow:0 2px 6px rgba(15,23,42,.05);font-weight:500}
  .opt:hover:not(:disabled),.mitem:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(37,99,235,.15)}
  .opt:active:not(:disabled){transform:scale(.99)}
  .opt.picked{box-shadow:0 0 0 3px rgba(37,99,235,.22);font-weight:600}
  [data-bs-theme=dark] .opt,[data-bs-theme=dark] .mitem{background:#131c2e;border-color:#334155;color:#e5e7eb}
  [data-bs-theme=dark] .opt:hover:not(:disabled),[data-bs-theme=dark] .mitem:hover{background:#1b2c52;border-color:#3b82f6}

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const sb = createClient('https://jkvjtjjimqvppvogotiu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imprdmp0amppbXF2cHB2b2dvdGl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2ODYzNzAsImV4cCI6MjEwODI2MjM3MH0.Zk-CdKAilLWVjwW8RmvmqRBfOFv9MyrJQxDGDud0qbs');
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Қателерді қазақшаға аудару ----------
const ERR_KK = [
  [/failed to fetch|networkerror|network request failed|load failed|fetch failed/i, 'Байланыс қатесі. Интернетті тексеріп, қайталаңыз.'],
  [/row-level security|permission denied|not authorized|unauthorized|forbidden|not allowed/i, 'Бұл әрекетке рұқсат жоқ.'],
  [/duplicate key|already exists|resource already exists/i, 'Мұндай жазба бұрыннан бар.'],
  [/payload too large|exceeded the maximum allowed size|too large|entity too large/i, 'Файл тым үлкен.'],
  [/mime type|invalid file type|not supported|unsupported/i, 'Бұл файл түріне рұқсат жоқ.'],
  [/bucket not found|object not found|not found/i, 'Сұралған дерек немесе файл табылмады.'],
  [/violates foreign key|foreign key/i, 'Бұл жазба басқа деректермен байланысты, өшіруге немесе өзгертуге болмайды.'],
  [/null value|not-null|violates not-null/i, 'Міндетті өріс толтырылмаған.'],
  [/invalid input syntax|invalid input|malformed/i, 'Енгізілген мән дұрыс емес.'],
  [/jwt|session|token|expired/i, 'Сессия мерзімі өтіп кетті. Қайта кіріңіз.'],
  [/rate limit|too many|429/i, 'Тым жиі сұраныс. Біраз күте тұрып, қайталаңыз.'],
  [/timeout|timed out|statement timeout/i, 'Күту уақыты өтіп кетті. Қайталап көріңіз.']
];
const errKK = e => {
  const m = String(e?.message || e || '');
  if (/[а-яәіңғүұқөһ]/i.test(m)) return m;   // қазақша хабар болса, сол күйінде
  const hit = ERR_KK.find(([re]) => re.test(m));
  return hit ? hit[1] : 'Күтпеген қате орын алды. Қайталап көріңіз.';
};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const title = (t, c) => `<h2 class="text-center fw-bold mb-4" style="color:${c || '#1e3a8a'}">${t}</h2>`;
let cache = null, Q = null, M = null, student = null, cur = null;
try { student = JSON.parse(localStorage.getItem('student') || 'null'); } catch (e) {}
const W = 520; // барлық ойын панельдерінің ортақ ені
const sbar = (w = W) => student
  ? `<div class="panel px-3 py-2 mb-3 mx-auto d-flex justify-content-between align-items-center gap-2" style="max-width:${w}px"><span class="small"><i class="bi bi-person-check-fill text-success me-2"></i><b>${esc(student.name)}</b> <span class="text-muted">· нәтиже мұғалімге сақталады</span></span><button class="btn btn-sm btn-outline-secondary rounded-pill flex-shrink-0" data-act="slogout">Шығу</button></div>`
  : `<div class="panel px-3 py-2 mb-3 mx-auto" style="max-width:${w}px"><div class="d-flex gap-2 align-items-center"><i class="bi bi-key-fill text-primary flex-shrink-0" title="Оқушы коды"></i><input id="sCode" class="form-control form-control-sm code-in flex-grow-1" style="min-width:0" placeholder="Оқушы коды (мысалы: K7M2QX)" autocomplete="off"><button class="btn btn-sm btn-primary rounded-pill px-3 flex-shrink-0" data-act="slogin">Кіру</button></div><div id="sErr" class="small text-danger"></div><div class="text-muted mt-1" style="font-size:12px">Кодсыз да ойнауға болады, бірақ нәтиже сақталмайды.</div></div>`;
const backBar = `<div class="mb-3"><button class="btn btn-sm btn-outline-secondary rounded-pill px-3" data-act="home"><i class="bi bi-arrow-left me-1"></i>Ойындар тізімі</button></div>`;
async function slogin() {
  const code = document.getElementById('sCode').value.trim().toUpperCase();
  if (!code) return;
  const { data, error } = await sb.rpc('student_login', { p_code: code });
  if (error || !data || !data.length) { document.getElementById('sErr').textContent = 'Код табылмады. Мұғалімнен сұраңыз.'; return; }
  student = { code, name: data[0].full_name };
  try { localStorage.setItem('student', JSON.stringify(student)); } catch (e) {}
  (cur || home)();
}
function slogout() { student = null; try { localStorage.removeItem('student'); } catch (e) {} (cur || home)(); }
async function saveResult(game, score, total) {
  if (!student) return;
  const { error } = await sb.rpc('save_result', { p_code: student.code, p_game: game, p_score: score, p_total: total });
  const n = document.getElementById('saveNote');
  if (n) n.textContent = error ? 'Нәтиже сақталмады: ' + errKK(error) : '✅ Нәтиже мұғалімге сақталды';
}

// Деректерді бетті ашқанда-ақ алдын ала жүктейміз + localStorage-та сақтаймыз (келесі кіргенде лезде ашылады)
const WKEY = 'games_words_v1', PKEY = 'games_pics_v1';
const lsGet = k => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return Array.isArray(v) && v.length ? v : null; } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let wordsP = null, picsCache = lsGet(PKEY), picsP = null;
cache = lsGet(WKEY);
function fetchWords() {
  if (!wordsP) {
    wordsP = (async () => {
      const { data, error } = await sb.from('words').select('id,word,meaning,work,author');
      if (error) throw error;
      const r = (data || []).filter(w => w.word && w.meaning);
      cache = r; lsSet(WKEY, r); return r;
    })();
    wordsP.catch(() => { wordsP = null; });
  }
  return wordsP;
}
function fetchPics() {
  if (!picsP) {
    picsP = (async () => {
      const { data, error } = await sb.from('pictures').select('*');
      if (error) throw error;
      picsCache = data || []; lsSet(PKEY, picsCache); return picsCache;
    })();
    picsP.catch(() => { picsP = null; });
  }
  return picsP;
}
function getWords() { return cache ? Promise.resolve(cache) : fetchWords(); }
const loading = () => { if (!cache) app.innerHTML = '<div class="text-center text-muted py-5">Жүктелуде...</div>'; };
fetchWords().catch(() => {}); fetchPics().catch(() => {});
const note = m => `<div class="panel p-5 text-center"><i class="bi bi-info-circle display-4 text-primary"></i><p class="mt-3 mb-4">${m}</p><button class="btn btn-primary rounded-pill px-4" data-act="home">Ойындар тізімі</button></div>`;

// ---------- Басты ----------
function home() {
  Q = M = A = null;
  const card = (ic, col, t, d, act) => `<div class="col-sm-6 col-lg-3"><div class="game-card panel h-100 text-center p-4">
    <i class="bi ${ic} text-${col}" style="font-size:4rem"></i><h4 class="fw-bold mt-3">${t}</h4>
    <p class="text-muted my-3">${d}</p><button class="btn btn-outline-${col} w-100 rounded-pill fw-bold" data-act="${act}">ОЙНАУ <i class="bi bi-play-fill"></i></button></div></div>`;
  cur = null;
  app.innerHTML = `<div class="pt-2"></div>` + title('Ойындарды таңдаңыз') + `<div class="row g-4 justify-content-center">
    ${card('bi-question-circle-fill', 'primary', 'Тест: Мағынаны тап', 'Сөз беріледі, оның дұрыс мағынасын нұсқалардан табыңыз.', 'quizSetup')}
    ${card('bi-puzzle-fill', 'success', 'Сәйкестендіру', 'Сөздер мен мағыналарды бір-бірімен сәйкестендіріңіз.', 'matchSetup')}
    ${card('bi-images', 'warning', 'Суретті тап', 'Суретке қарап, жасырылған атауды табыңыз.', 'picture')}
    ${card('bi-shuffle', 'danger', 'Сөзді құрастыр', 'Араласып кеткен әріптерден сөзді жинап, мағынасы бойынша табыңыз.', 'anaSetup')}
    ${card('bi-person-lines-fill', 'info', 'Авторды тап', 'Сөздің қай автордың шығармасынан алынғанын табыңыз.', 'authSetup')}
    ${card('bi-patch-question-fill', 'secondary', 'Шын ба, жалған ба?', 'Сөз бен мағына сәйкес келе ме? Тез шешім қабылдаңыз.', 'tfSetup')}
    ${card('bi-book-half', 'primary', 'Шығарманы тап', 'Сөз қай шығармада кездеседі? Дұрыс нұсқаны таңдаңыз.', 'workSetup')}
    ${card('bi-card-text', 'dark', 'Жаттау карточкалары', 'Сөзді көріп, мағынасын еске түсіріп, картаны аударыңыз.', 'cardsStart')}</div>`;
}

// ---------- Тест ----------
async function quizSetup() {
  loading();
  let ws; try { ws = await getWords(); } catch (e) { app.innerHTML = note('Қате: ' + esc(errKK(e))); return; }
  const works = [...new Set(ws.map(w => w.work).filter(Boolean))];
  cur = quizSetup;
  app.innerHTML = title('Тест параметрлері') + sbar() + `<div class="panel p-4 p-md-5" style="max-width:${W}px;margin:auto">
    <label class="form-label fw-bold">Шығарма:</label>
    <select id="qWork" class="form-select form-select-lg mb-4"><option value="">📚 Барлық шығармалар</option>${works.map(w => `<option>${esc(w)}</option>`).join('')}</select>
    <label class="form-label fw-bold">Сұрақ саны:</label>
    <select id="qCount" class="form-select form-select-lg mb-4"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
    <button class="btn btn-primary btn-lg w-100 fw-bold" data-act="quizStart">ТЕСТТІ БАСТАУ</button>
    <button class="btn btn-outline-secondary w-100 mt-2" data-act="home"><i class="bi bi-arrow-left me-1"></i>Ойындар тізімі</button></div>`;
}
function quizStart() {
  const work = document.getElementById('qWork').value, n = +document.getElementById('qCount').value;
  const pool = cache.filter(w => !work || w.work === work);
  if (pool.length < 2) { app.innerHTML = note('Тест үшін кемінде 2 сөз қажет. Басқа шығарманы таңдаңыз.'); return; }
  Q = { i: 0, items: shuffle(pool).slice(0, n).map(w => {
    const others = shuffle([...new Set(cache.map(x => x.meaning))].filter(m => m !== w.meaning)).slice(0, 3);
    return { q: w.word, correct: w.meaning, options: shuffle([w.meaning, ...others]), user: null };
  }) };
  quizQ();
}
function quizQ() {
  const it = Q.items[Q.i], answered = it.user !== null;
  app.innerHTML = backBar + `<div class="panel q-panel"><div class="q-badge-row"><span class="q-badge">${Q.i + 1}/${Q.items.length}</span></div>
    <h4 class="q-title mb-3">${it.html || `<b>"${esc(it.q)}"</b> сөзінің мағынасы қайсы?`}</h4>
    ${it.options.map((o, k) => `<button class="opt ${it.user === o ? 'picked' : ''}" data-act="pick" data-k="${k}">${esc(o)}</button>`).join('')}
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-outline-secondary flex-fill" data-act="quizPrev" ${Q.i === 0 ? 'disabled' : ''}><i class="bi bi-arrow-left me-1"></i>Артқа</button>
      <button class="btn btn-primary flex-fill" data-act="quizNext">${Q.i === Q.items.length - 1 ? 'Аяқтау' : 'Келесі'}<i class="bi bi-arrow-right ms-1"></i></button>
    </div>
  </div>`;
}
function quizPick(k) {
  const it = Q.items[Q.i];
  it.user = it.options[k]; // дұрыс жауап Аяқтау басылғанға дейін көрсетілмейді
  quizQ();
  if (Q.i < Q.items.length - 1) { // таңдағаннан кейін бірден келесі сұраққа өтеді
    const q = Q, i = Q.i;
    setTimeout(() => { if (Q === q && Q.i === i) { Q.i++; quizQ(); } }, 280);
  }
}
function quizPrev() {
  if (Q.i > 0) { Q.i--; quizQ(); }
}
function quizNext() {
  if (Q.i === Q.items.length - 1) {
    quizResult();
    return;
  }
  Q.i++;
  quizQ();
}
function quizResult() {
  const ok = Q.items.filter(i => i.user === i.correct).length, t = Q.items.length, good = ok >= t / 2;
  saveResult(Q.name || 'Тест', ok, t);
  app.innerHTML = `<div class="page-hero p-5 text-center mb-4" style="background:${good ? 'linear-gradient(135deg,#198754,#20c997)' : 'linear-gradient(135deg,#dc3545,#ff6b6b)'}">

async function matchSetup() {
  loading();
  try { await getWords(); } catch (e) { app.innerHTML = note('Қате: ' + esc(errKK(e))); return; }
  cur = matchSetup;
  app.innerHTML = title('Сәйкестендіру ойыны', '#198754') + sbar() + `<div class="panel p-4 p-md-5" style="max-width:${W}px;margin:auto">
    <label class="form-label fw-bold">Жұп саны:</label>
    <select id="mCount" class="form-select form-select-lg mb-4"><option>5</option><option>8</option><option>10</option></select>
    <button class="btn btn-success btn-lg w-100 fw-bold" data-act="matchStart">Бастау</button>
    <button class="btn btn-outline-secondary w-100 mt-2" data-act="home"><i class="bi bi-arrow-left me-1"></i>Ойындар тізімі</button></div>`;
}
function matchStart() {
  const n = +document.getElementById('mCount').value;
  const seen = new Set(), uniq = cache.filter(w => !seen.has(w.meaning) && seen.add(w.meaning));
  if (uniq.length < 2) { app.innerHTML = note('Ойын үшін кемінде 2 сөз қажет.'); return; }
  const pool = shuffle(uniq).slice(0, n).map((w, id) => ({ id, word: w.word, meaning: w.meaning }));
  M = { pool, left: shuffle(pool), right: shuffle(pool), pairs: [], selectedWord: null, selectedMeaning: null, checked: false, t0: Date.now(), lock: false, correctCount: 0, miss: 0 };
  matchDraw();
}
function renderMatchConnections() {
  const board = document.getElementById('matchBoard');
  const svg = document.getElementById('matchConnections');
  if (!board || !svg || !M) return;
  const lines = [];
  if (M.selectedWord && M.selectedMeaning) {
    lines.push({ a: M.selectedWord, b: M.selectedMeaning, color: '#2563eb', width: 4, opacity: 0.9 });
  }
  M.pairs.forEach(pair => {
    const leftEl = document.querySelector(`.mitem[data-side="w"][data-id="${pair.leftId}"]`);
    const rightEl = document.querySelector(`.mitem[data-side="m"][data-id="${pair.rightId}"]`);
    if (!leftEl || !rightEl) return;
    const color = M.checked ? (pair.leftId === pair.rightId ? '#16a34a' : '#ef4444') : '#2563eb';
    lines.push({ a: leftEl, b: rightEl, color, width: 4, opacity: M.checked ? 1 : 0.9 });
  });
  const boardRect = board.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${boardRect.width} ${boardRect.height}`);
  svg.innerHTML = lines.map(({ a, b, color, width, opacity }) => {
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const x1 = ra.left - boardRect.left + ra.width / 2;
    const y1 = ra.top - boardRect.top + ra.height / 2;
    const x2 = rb.left - boardRect.left + rb.width / 2;
    const y2 = rb.top - boardRect.top + rb.height / 2;
    const cx1 = x1 + (x2 - x1) * 0.35;
    const cy1 = y1;
    const cx2 = x2 - (x2 - x1) * 0.35;
    const cy2 = y2;
    return `<path d="M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}" stroke="${color}" stroke-width="${width}" fill="none" stroke-linecap="round" opacity="${opacity}"/>`;
  }).join('');
}
function matchDraw() {
  const col = (list, side) => list.map(p => `<button class="mitem ${M.pairs.some(pair => (side === 'w' ? pair.leftId : pair.rightId) === p.id) ? 'sel' : ''}" data-act="msel" data-side="${side}" data-id="${p.id}">${esc(side === 'w' ? p.word : p.meaning)}</button>`).join('');
  app.innerHTML = backBar + title('Сөзді мағынасымен сәйкестендіріңіз', '#198754') + `<div class="match-board" id="matchBoard"><svg id="matchConnections" class="match-connections"></svg><div class="row"><div class="col-5 col-md-5"><h6 class="text-center text-success">СӨЗДЕР</h6>${col(M.left, 'w')}</div>
    <div class="col-7 col-md-7"><h6 class="text-center text-success">МАҒЫНАЛАР</h6>${col(M.right, 'm')}</div></div></div>
    <div class="d-flex justify-content-between align-items-center mt-3 gap-3">
      <h5 class="text-center fw-bold mb-0 flex-grow-1" id="mStat">Қосылған: ${M.pairs.length}/${M.pool.length}</h5>
      <button class="btn btn-success rounded-pill px-4" data-act="matchCheck" ${M.pairs.length !== M.pool.length ? 'disabled' : ''}>Аяқтау</button>
    </div>`;
  requestAnimationFrame(renderMatchConnections);
}
function matchSel(btn) {
  if (M.lock || M.checked) return;
  const side = btn.dataset.side;
  if (side === 'w') {
    if (M.selectedWord) M.selectedWord.classList.remove('sel');
    M.selectedWord = btn;
    btn.classList.add('sel');
  } else {
    if (M.selectedMeaning) M.selectedMeaning.classList.remove('sel');
    M.selectedMeaning = btn;
    btn.classList.add('sel');
  }
  if (!M.selectedWord || !M.selectedMeaning) return;

  const leftId = Number(M.selectedWord.dataset.id), rightId = Number(M.selectedMeaning.dataset.id);
  const existingIndex = M.pairs.findIndex(pair => pair.leftId === leftId || pair.rightId === rightId);
  if (existingIndex >= 0) M.pairs.splice(existingIndex, 1);
  M.pairs.push({ leftId, rightId, isCorrect: null });
  M.selectedWord.classList.remove('sel');
  M.selectedMeaning.classList.remove('sel');
  M.selectedWord = M.selectedMeaning = null;
  matchDraw();
}
function matchCheck() {
  if (M.checked || M.pairs.length !== M.pool.length) return;
  M.checked = true;
  M.correctCount = M.pairs.filter(pair => pair.leftId === pair.rightId).length;
  M.miss = M.pool.length - M.correctCount;
  document.getElementById('mStat').textContent = `Дұрыс: ${M.correctCount}/${M.pool.length}`;
  const sec = Math.round((Date.now() - M.t0) / 1000);
  saveResult('Сәйкестендіру', M.correctCount, M.pool.length);
  app.innerHTML = `<div class="page-hero p-5 text-center mb-4" style="background:linear-gradient(135deg,#198754,#20c997)">
    <h3 class="fw-bold">${M.miss === 0 ? '🏆 КЕРЕМЕТ! Қатесіз!' : 'Ойын аяқталды!'}</h3>
    <div class="display-4 fw-bold">${M.correctCount}/${M.pool.length}</div><p class="mb-0">Қате: ${M.miss} · Уақыт: ${sec} сек</p></div>
    <h5 class="fw-bold mb-3">Сәйкестендіру нәтижесі</h5>
    ${M.pool.map(p => `<div class="panel p-3 mb-2"><b>${esc(p.word)}</b> — <span class="text-muted">${esc(p.meaning)}</span></div>`).join('')}
    <div class="text-center small text-muted mt-3" id="saveNote"></div><div class="text-center mt-3"><button class="btn btn-success rounded-pill px-4 me-2" data-act="matchSetup">Қайта ойнау</button>
    <button class="btn btn-outline-secondary rounded-pill px-4" data-act="home">Ойындар тізімі</button></div>`;
}

let A = null;
const lc = s => String(s).trim().toLocaleLowerCase('kk');

}

const cflip = () => { C.flip = !C.flip; cardDraw(); };
const cprev = () => { if (C.i > 0) { C.i--; C.flip = false; cardDraw(); } };
const cnext = () => { C.i = C.i + 1 < C.items.length ? C.i + 1 : 0; C.flip = false; cardDraw(); };

// ---------- Басқару ----------
const acts = { slogin, slogout, home, quizSetup, quizStart, quizPrev, quizNext, matchSetup, matchStart, matchCheck, picture, presult, anaSetup, anaStart, anaCheck, authSetup, authStart, workSetup, workStart, tfSetup, tfStart, cardsStart, cflip, cprev, cnext };
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'pick') quizPick(+b.dataset.k);
  else if (a === 'msel') matchSel(b);
  else if (a === 'pcheck') pcheck(+b.dataset.i);
  else acts[a]();
});
app.addEventListener('keydown', e => { if (e.key === 'Enter') { if (e.target.id === 'sCode') slogin(); else if (e.target.id === 'anaIn') anaCheck(); } });
home();
</script>
