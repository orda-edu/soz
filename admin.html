<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ панель - SözÖrnegi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--blue:#0072bc;--blue-d:#1e3a8a;--red:#c1272d;--ink:#0f172a;--side:#1e293b}
  html,body{height:100%;margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:#f1f5f9}
  .topbar{background:linear-gradient(90deg,#005a99,var(--blue) 55%,#2f8fd8);height:76px;display:flex;align-items:center;padding:0 32px;color:#fff;font-weight:800;font-size:24px;letter-spacing:.3px;box-shadow:0 4px 18px rgba(0,114,188,.35);position:relative;z-index:5}
  .topbar small{font-weight:500;opacity:.8;font-size:13px;margin-left:14px;padding:3px 12px;border:1px solid rgba(255,255,255,.4);border-radius:20px}
  .topbar a{color:#fff;text-decoration:none;margin-left:auto;font-size:14px;font-weight:600;background:rgba(255,255,255,.15);padding:8px 18px;border-radius:20px;transition:.2s}
  .topbar a:hover{background:rgba(255,255,255,.28)}
  .layout{display:flex;min-height:calc(100% - 76px)}
  .side{width:290px;background:linear-gradient(180deg,#1e293b,#0f172a);padding:30px 26px;flex-shrink:0}
  .btn-new{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:var(--blue);border:0;border-radius:30px;padding:13px;font-weight:700;font-size:17px;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:.2s}
  .btn-new:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.35)}
  .nav-s{margin-top:44px}
  .nav-s a{display:flex;align-items:center;gap:12px;color:#cbd5e1;font-weight:600;font-size:17px;padding:11px 20px;margin-bottom:8px;border-radius:30px;text-decoration:none;transition:.2s}
  .nav-s a:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-s a.active{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(0,114,188,.45)}
  .main{flex:1;padding:30px 44px;min-width:0}
  .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  .main h1{font-weight:800;font-size:38px;margin:0;color:var(--ink);position:relative;padding-bottom:10px}
  .main h1::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:5px;border-radius:5px;background:var(--blue)}
  .btn-red{background:linear-gradient(135deg,#d93a40,var(--red));color:#fff;border:0;border-radius:30px;padding:13px 34px;font-weight:700;font-size:17px;box-shadow:0 6px 16px rgba(193,39,45,.35);transition:.2s}
  .btn-red:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(193,39,45,.45)}
  .fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;background:#fff;border:1px solid #dbe5f0;border-radius:20px;padding:12px 16px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .fbar .fsel{width:auto;min-width:170px;max-width:240px;border-radius:20px}
  .fbar .form-control-sm{border-radius:20px}
  .tbl{background:#fff;border:1px solid #dbe5f0;border-radius:26px;padding:18px;margin-top:16px;box-shadow:0 10px 30px rgba(15,23,42,.07)}
  .th-row,.tr-row{display:flex;gap:20px}
  .pill{background:linear-gradient(135deg,var(--blue),#2f8fd8);color:#fff;border-radius:30px;padding:9px 26px;font-weight:700;font-size:18px}
  .c1{flex:0 0 38%}.c2{flex:1;min-width:0}
  .tr-row{padding:18px 12px;border-bottom:1px solid #e2e8f0;transition:.15s;border-radius:14px}
  .tr-row:hover{background:#f0f7fd}
  .tr-row:last-child{border-bottom:0}
  .tr-row .c1{font-weight:700;font-size:19px;padding-left:18px;word-break:break-word}
  .tr-row .c2{font-size:14px;line-height:1.55;color:#334155;white-space:pre-line}
  .thumb{max-width:100%;max-height:120px;border-radius:12px;border:1px solid #cbd5e1;box-shadow:0 3px 10px rgba(0,0,0,.1)}
  .del{border:1px solid #fecaca;background:#fef2f2;color:var(--red);font-size:13px;font-weight:600;padding:3px 14px;border-radius:20px;margin-top:10px;transition:.2s}
  .del:hover{background:var(--red);color:#fff}
  .act{border:1px solid #bfdbfe;background:#eff6ff;color:var(--blue);font-size:13px;font-weight:600;padding:3px 14px;border-radius:20px;margin:10px 6px 0 0;transition:.2s;display:inline-block;text-decoration:none}
  .act:hover{background:var(--blue);color:#fff}
  .login-wrap{min-height:calc(100% - 76px);display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#e0f0fb,#f1f5f9)}
  .login-card{background:#fff;border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,114,188,.18)}
  .login-card .ic{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#2f8fd8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px}
  .form-control,.form-select{border-radius:12px;padding:11px 14px;border-color:#cbd5e1}
  .form-control:focus,.form-select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,114,188,.15)}
  .btn-login{background:linear-gradient(135deg,var(--blue),#2f8fd8);color:#fff;border:0;border-radius:30px;padding:12px;font-weight:700;width:100%}
  .modal-content{border:0;border-radius:24px!important;box-shadow:0 25px 60px rgba(15,23,42,.3)}
  .modal-header{padding:24px 28px 8px}.modal-body{padding:12px 28px}.modal-footer{padding:8px 28px 24px}
  .modal-title{font-weight:800;color:var(--blue-d)}
  .btn-primary{background:var(--blue);border-color:var(--blue)}
  @media(max-width:800px){.layout{flex-direction:column}.side{width:100%;padding:18px}.nav-s{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px}.nav-s a{margin:0;font-size:15px;padding:8px 14px}.main{padding:20px}.main h1{font-size:28px}.tr-row,.th-row{gap:10px}.c1{flex-basis:42%}.pill{font-size:14px;padding:7px 14px}.tr-row .c1{font-size:16px;padding-left:6px}.topbar{padding:0 16px;font-size:20px}.topbar small{display:none}}
</style>
</head>
<body>
<div class="topbar"><i class="bi bi-book-half me-2"></i>SözÖrnegi <small>Админ панель</small><a href="index.html"><i class="bi bi-box-arrow-left me-1"></i>Басты бетке қайту</a></div>

<div id="loginSection" class="login-wrap">
  <div class="login-card">
    <div class="ic"><i class="bi bi-shield-lock-fill"></i></div>
    <h4 class="text-center fw-bold mb-4">Админ панельге кіру</h4>
    <form id="loginForm">
      <input type="text" id="username" class="form-control mb-3" placeholder="Логин" required>
      <input type="password" id="password" class="form-control mb-3" placeholder="Пароль" required>
      <div id="loginError" class="alert alert-danger d-none py-2 text-center">Логин немесе пароль қате!</div>
      <button class="btn-login">Кіру</button>
    </form>
  </div>
</div>

<div class="layout d-none" id="adminSection">
  <aside class="side">
    <button class="btn-new" id="btnNewWord"><i class="bi bi-plus-circle-fill"></i>Жаңа сөз қосу</button>
    <nav class="nav-s">
      <a href="#" data-view="authors" class="active"><i class="bi bi-person-fill"></i>Авторлар</a>
      <a href="#" data-view="works"><i class="bi bi-book-fill"></i>Шығармалар</a>
      <a href="#" data-view="words"><i class="bi bi-chat-quote-fill"></i>Сөздер</a>
      <a href="#" data-view="pictures"><i class="bi bi-images"></i>Суреттер</a>
      <a href="#" data-view="kmzh"><i class="bi bi-journal-text"></i>ҚМЖ</a>
      <a href="#" data-view="videos"><i class="bi bi-play-circle-fill"></i>Бейнесабақтар</a>
    </nav>
  </aside>
  <section class="main">
    <div class="head">
      <h1 id="pageTitle">АВТОРЛАР</h1>
      <button class="btn-red" id="btnAdd">Автор енгізу</button>
    </div>
    <div class="fbar" id="filterBar"></div>
    <div class="tbl">
      <div class="th-row"><div class="pill c1" id="h1">Аты-жөні:</div><div class="pill c2" id="h2">Автор туралы</div></div>
      <div id="rows"><div class="p-4 text-muted">Жүктелуде...</div></div>
    </div>
  </section>
</div>

<div class="modal fade" id="formModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <form class="modal-content" id="modalForm">
      <div class="modal-header border-0"><h5 class="modal-title" id="mTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="mBody"></div>
      <div class="modal-footer border-0">
        <div id="mMsg" class="me-auto fw-bold"></div>
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Жабу</button>
        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Сақтау</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
